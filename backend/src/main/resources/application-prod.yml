spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
management:
  server:
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
    port: ${MANAGEMENT_PORT:9081}
yueji:
  files:
    root: ${FILE_STORAGE_ROOT}
  mock-payment-enabled: false
  payment:
    provider: ${PAYMENT_PROVIDER:ALIPAY_SANDBOX}
