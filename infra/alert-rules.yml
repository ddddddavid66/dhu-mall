groups:
  - name: yueji-business
    rules:
      - alert: YuejiOutboxDelayed
        expr: yueji_outbox_oldest_seconds > 120 or yueji_outbox_failed_count > 0
        for: 30s
        labels: {severity: warning}
        annotations: {summary: 'Outbox facts require recovery'}
      - alert: YuejiPaymentCloseStuck
        expr: yueji_payment_closing_oldest_seconds > 300
        for: 30s
        labels: {severity: warning}
        annotations: {summary: 'Payment closing remains unknown; retain reservation'}
      - alert: YuejiRefundProcessingStuck
        expr: yueji_refund_processing_oldest_seconds > 600
        for: 30s
        labels: {severity: warning}
        annotations: {summary: 'Query original refund number; do not recreate'}
      - alert: YuejiInventoryConstraintViolation
        expr: yueji_inventory_constraint_violations > 0
        labels: {severity: critical}
        annotations: {summary: 'Stop affected inventory operations and investigate'}
  - name: yueji-runtime
    rules:
      - alert: YuejiBackendUnavailable
        expr: up{job="yueji-backend"} == 0
        for: 45s
        labels:
          severity: critical
        annotations:
          summary: Yueji backend scrape is unavailable
          description: Backend metrics scrape failed for at least three 15-second intervals.

      - alert: YuejiHttp5xxRatioHigh
        expr: |
          (
            sum(increase(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
            clamp_min(sum(increase(http_server_requests_seconds_count[5m])), 1)
          ) > 0.01
          and sum(increase(http_server_requests_seconds_count[5m])) >= 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Yueji HTTP 5xx ratio exceeds one percent
          description: The 5-minute sample contains at least 100 requests and the 5xx ratio exceeds 1%.

      - alert: YuejiDatabasePoolWaiting
        expr: hikaricp_connections_pending > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Yueji database connection requests are waiting
          description: Inspect database capacity, slow queries, and connection leaks.
