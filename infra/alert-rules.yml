groups:
  - name: yueji-runtime
    rules:
      - alert: YuejiBackendUnavailable
        expr: up{job="yueji-backend"} == 0
        for: 45s
        labels:
          severity: critical
        annotations:
          summary: Yueji backend scrape is unavailable
          description: Backend metrics scrape failed for at least three 15-second intervals.

      - alert: YuejiHttp5xxRatioHigh
        expr: |
          (
            sum(increase(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
            clamp_min(sum(increase(http_server_requests_seconds_count[5m])), 1)
          ) > 0.01
          and sum(increase(http_server_requests_seconds_count[5m])) >= 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Yueji HTTP 5xx ratio exceeds one percent
          description: The 5-minute sample contains at least 100 requests and the 5xx ratio exceeds 1%.

      - alert: YuejiDatabasePoolWaiting
        expr: hikaricp_connections_pending > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Yueji database connection requests are waiting
          description: Inspect database capacity, slow queries, and connection leaks.
