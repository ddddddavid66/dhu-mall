x-rotated-logs: &rotated-logs
  driver: json-file
  options:
    max-size: 20m
    max-file: "10"

services:
  alloy:
    image: grafana/alloy@sha256:89a5a320168387336b9ac3c850609c3ba7757eadd4ae5f1d819deb35e9854b18
    profiles: [observability]
    restart: unless-stopped
    command: [run, /etc/alloy/config.alloy, --storage.path=/var/lib/alloy]
    volumes:
      - ./alloy.config:/etc/alloy/config.alloy:ro
      - application-logs:/var/log/yueji:ro
      - alloy-data:/var/lib/alloy
    networks: [yueji]
    depends_on: [loki]
    logging: *rotated-logs
  alertmanager:
    image: prom/alertmanager@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    profiles: [observability]
    restart: unless-stopped
    command: [--config.file=/etc/alertmanager/config.yml, --storage.path=/alertmanager]
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/config.yml:ro
      - alertmanager-data:/alertmanager
    networks: [yueji]
    depends_on: [alert-receiver]
    logging: *rotated-logs
  alert-receiver:
    image: python@sha256:d98cc29d3266e535dd9da1099688d9cb3ca4753813571e071763d17725460962
    profiles: [observability]
    restart: unless-stopped
    read_only: true
    command: [python, /app/receiver.py]
    volumes:
      - ./alert-receiver.py:/app/receiver.py:ro
      - alert-evidence:/evidence
    networks: [yueji]
    logging: *rotated-logs
  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    profiles: [observability]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    networks: [yueji]
    logging: *rotated-logs

  loki:
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    profiles: [observability]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks: [yueji]
    logging: *rotated-logs

  grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    profiles: [observability]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-ops}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?load the Grafana password from a protected secret file}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000/}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    networks: [yueji]
    logging: *rotated-logs

volumes:
  alloy-data:
  alertmanager-data:
  alert-evidence:
  prometheus-data:
  loki-data:
  grafana-data:
