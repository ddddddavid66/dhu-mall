global:
  resolve_timeout: 1m
route:
  receiver: local-test-evidence
  group_by: [alertname, service]
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 4h
receivers:
  - name: local-test-evidence
    webhook_configs:
      - url: http://alert-receiver:9099/alerts
        send_resolved: true
